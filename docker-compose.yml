services:
  load-test:
    profiles: ["loadtest"]
    image: grafana/k6:0.54.0
    environment:
      BASE_URL: ${LOAD_TEST_BASE_URL:-http://host.docker.internal:8001/api/v1}
      BENCHMARK_EMAIL: ${BENCHMARK_EMAIL:-demo@squadup.test}
      BENCHMARK_EMAILS: ${BENCHMARK_EMAILS:-}
      BENCHMARK_PASSWORD: ${BENCHMARK_PASSWORD:-}
      SUMMARY_FILE: ${LOAD_TEST_SUMMARY_FILE:-phase-3-load-summary.json}
      STAGE_10: ${LOAD_TEST_STAGE_10:-20s}
      STAGE_50: ${LOAD_TEST_STAGE_50:-20s}
      STAGE_100: ${LOAD_TEST_STAGE_100:-20s}
      STAGE_10_TARGET: ${LOAD_TEST_STAGE_10_TARGET:-10}
      STAGE_50_TARGET: ${LOAD_TEST_STAGE_50_TARGET:-50}
      STAGE_100_TARGET: ${LOAD_TEST_STAGE_100_TARGET:-100}
      RAMP_DOWN_DURATION: ${LOAD_TEST_RAMP_DOWN_DURATION:-10s}
      ITERATION_SLEEP_SECONDS: ${LOAD_TEST_ITERATION_SLEEP_SECONDS:-0.2}
    command: run /scripts/squadup-api.js
    volumes:
      - ./scripts/load-test:/scripts:ro
      - ./docs/performance:/results

  test:
    profiles: ["test"]
    build:
      context: ./backend
    working_dir: /app
    command: php artisan test
    environment:
      APP_ENV: testing
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      PRESENCE_STORE: array
      BROADCAST_CONNECTION: "null"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PERFORMANCE_PROFILING_ENABLED: "false"
    volumes:
      - ./backend:/app

  benchmark-init:
    profiles: ["benchmark"]
    image: alpine:3.22
    command: sh -c "rm -rf /target/* /target/.[!.]* /target/..?* 2>/dev/null || true; cp -a /source/. /target/; chown -R 82:82 /target"
    volumes:
      - ./backend:/source:ro
      - squadup_benchmark_code:/target

  api-benchmark:
    profiles: ["benchmark"]
    image: squadup-api
    working_dir: /app
    command: sh -c "php artisan optimize && php artisan serve --host=0.0.0.0 --port=8001 --no-reload"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:n/i0I7Q+uA7z46W7BRTNAFYGfEKv4BxeQvYZDQpHhmA=}
      APP_URL: http://localhost:8001
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-squadup}
      DB_USERNAME: ${POSTGRES_USER:-squadup}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      PERFORMANCE_PROFILING_ENABLED: "true"
      API_RATE_LIMIT_PER_MINUTE: "100000"
    ports:
      - "8001:8001"
    volumes:
      - squadup_benchmark_code:/app
      - ./backend/docker/benchmark-opcache.ini:/usr/local/etc/php/conf.d/zz-benchmark-opcache.ini:ro
    depends_on:
      benchmark-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8001/up"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-squadup}
      DB_USERNAME: ${POSTGRES_USER:-squadup}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: squadup-local
      REVERB_APP_KEY: squadup-local-key
      REVERB_APP_SECRET: squadup-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/docker/development-opcache.ini:/usr/local/etc/php/conf.d/zz-development-opcache.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 10

  reverb:
    build:
      context: ./backend
    working_dir: /app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-squadup}
      DB_USERNAME: ${POSTGRES_USER:-squadup}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CACHE_STORE: redis
      REDIS_HOST: redis
      REVERB_APP_ID: squadup-local
      REVERB_APP_KEY: squadup-local-key
      REVERB_APP_SECRET: squadup-local-secret
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SCALING_ENABLED: "true"
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: ./backend
    working_dir: /app
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-squadup}
      DB_USERNAME: ${POSTGRES_USER:-squadup}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: squadup-local
      REVERB_APP_KEY: squadup-local-key
      REVERB_APP_SECRET: squadup-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    extends:
      service: queue
    command: php artisan schedule:work
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-squadup}
      POSTGRES_USER: ${POSTGRES_USER:-squadup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - squadup_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - squadup_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  squadup_postgres:
  squadup_redis:
  squadup_benchmark_code:
