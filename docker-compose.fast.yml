services:
  api-fast:
    image: ${SQUADUP_OCTANE_IMAGE:-squadup-api-octane:latest}
    working_dir: /var/www/html
    command: >-
      php artisan octane:start
      --server=roadrunner
      --host=0.0.0.0
      --port=8000
      --workers=${OCTANE_WORKERS:-4}
      --max-requests=${OCTANE_MAX_REQUESTS:-500}
      --log-level=warn
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:n/i0I7Q+uA7z46W7BRTNAFYGfEKv4BxeQvYZDQpHhmA=}
      APP_URL: http://localhost:8001
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-squadup}
      DB_USERNAME: ${POSTGRES_USER:-squadup}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: squadup-local
      REVERB_APP_KEY: squadup-local-key
      REVERB_APP_SECRET: squadup-local-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      AUTORUN_ENABLED: "false"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
