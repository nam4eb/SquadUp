x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
  PERFORMANCE_PROFILING_ENABLED: ${PERFORMANCE_PROFILING_ENABLED:-false}
  PHP_FPM_PM_CONTROL: ${PHP_FPM_PM_CONTROL:-dynamic}
  PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-40}
  PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-8}
  PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-8}
  PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-20}
  PHP_FPM_PM_MAX_REQUESTS: ${PHP_FPM_PM_MAX_REQUESTS:-500}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-squadup}
  DB_USERNAME: ${POSTGRES_USER:-squadup}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http

x-app-service: &app-service
  image: ${SQUADUP_IMAGE:-squadup-api-production:latest}
  build:
    context: ./backend
    dockerfile: Dockerfile.production
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - squadup_storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app-service
    expose:
      - "8080"
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8080"
    volumes:
      - ./backend/docker/nginx/load-balancer.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    <<: *app-service
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90 --max-time=3600
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "false"
    stop_grace_period: 100s
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *app-service
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "false"
      REVERB_SCALING_ENABLED: "true"
    ports:
      - "${REVERB_PORT:-8080}:8080"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app-service
    command: php artisan schedule:work
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "false"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-squadup}
      POSTGRES_USER: ${POSTGRES_USER:-squadup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - squadup_postgres_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - squadup_redis_production:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  squadup_postgres_production:
  squadup_redis_production:
  squadup_storage:
